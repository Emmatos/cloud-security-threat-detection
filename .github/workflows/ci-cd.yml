
name: Cloud Security Threat Detection CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Security Checks, Tests and Docker Build
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # 3. Install application dependencies
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Install development and security tools
      - name: Install development tools
        run: |
          pip install -r requirements-dev.txt

      # 5. Check Python code quality
      - name: Run Ruff
        run: |
          ruff check src tests dashboard

      # 6. Scan Python code for security issues
      - name: Run Bandit
        run: |
          bandit -r src dashboard -f screen

      # 7. Audit application dependencies
      - name: Run dependency vulnerability audit
        run: |
          pip-audit -r requirements.txt

      # 8. Run automated application tests
      - name: Run automated tests
        run: |
          python -m pytest -v

      # 9. Validate Docker image build
      - name: Build Docker image
        run: |
          docker build -t cloud-security-threat-detection:ci .
